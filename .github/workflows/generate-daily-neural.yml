name: Generate selected daily lesson Neural audio
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/daily-audio-texts.json
      - scripts/generate_daily_audio.py
      - .github/workflows/generate-daily-neural.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-neural-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'edge-tts>=7,<8' 'mutagen>=1.47,<2'
      - name: Generate missing SunHi and HoaiMy clips
        run: python scripts/generate_daily_audio.py
      - name: Commit audio to the tested feature branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add Neural speech for the selected daily lesson'
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Verify the branch with the new audio
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: gh workflow run smoke-cards.yml --ref "$TARGET_BRANCH"
