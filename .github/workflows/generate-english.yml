name: Generate English and IPA for all cards
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export-english-sources.mjs'
      - 'scripts/build-english.py'
      - '.github/workflows/generate-english.yml'
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nhi's Learning Corner
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source translation and pronunciation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python -m pip install --disable-pip-version-check 'argostranslate>=1.9,<2' 'phonemizer>=3,<4'
      - name: Export all lesson and old flashcard texts
        run: node scripts/export-english-sources.mjs
      - name: Translate to English and generate en-US IPA
        run: python scripts/build-english.py
      - name: Verify dataset coverage
        run: |
          python - <<'PY'
          import json
          src=json.load(open('.english-sources.json'))
          eng=json.load(open('english.json'))['cards']
          assert len(eng)==len(src),(len(eng),len(src))
          assert all(eng[x].get('en') for x in src)
          print('Verified English coverage:',len(eng),'cards')
          PY
      - name: Commit and publish English dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english.json
          if git diff --cached --quiet; then echo "All English data already up to date"; exit 0; fi
          git commit -m "Add English translations and IPA for all built-in flashcards"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
