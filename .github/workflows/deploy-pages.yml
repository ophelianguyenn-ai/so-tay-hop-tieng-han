name: Publish Nhi's Learning Corner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout original app and study material
        uses: actions/checkout@v4

      - name: Prepare static GitHub Pages output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # Only publish files required by the app. Never upload .github,
          # scripts, Netlify settings, internal notes or credentials.
          files=(
            index.html sw.js manifest.webmanifest
            lessons.json technical-images.json audio-manifest.json
            qrcode.js garden-v10.js
            hanja-v9.js hanja-extra-v12.js
            card-images-v11.js technical-visuals-v12.js
            image-picker-v13.js hard-mascot-v13.js
            transparent-mascot-v14.js mascot-controls-v12.js
            recorded-voices-v11.js backup-portable-v1.js
            refresh-v9.css study-enhancements-v13.css
            icon-192.png icon-512.png nhi-avatar.png
            nhi-mascot.webp nhi-puzzled.webp
            garden-day.webp garden-night.webp
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "Required asset missing: $file"; exit 1; }
            cp -- "$file" _site/
          done
          if [ -d pictures ]; then cp -R pictures _site/; fi
          if [ -d audio ]; then cp -R audio _site/; fi
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/lessons.json
          echo "Static website assembled; data and illustrations preserved."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
