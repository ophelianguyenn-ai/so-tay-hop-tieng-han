name: Generate Korean and Vietnamese MP3 (Microsoft Edge TTS)
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language: both, ko, or vi"
        required: true
        type: choice
        options:
          - both
          - ko
          - vi
        default: both
      offset:
        description: "Start from item number (0 for first)"
        required: false
        default: "0"
      limit:
        description: "How many unique phrases (0 = all remaining)"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: generate-korean-vietnamese-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voice generator and audio inspector
        run: python -m pip install --upgrade "edge-tts>=7,<8" "mutagen>=1.47,<2"
      - name: Generate missing audio files, with checkpoint manifest
        run: |
          python scripts/generate_tts.py --lang "${{ inputs.language }}" --offset "${{ inputs.offset }}" --limit "${{ inputs.limit }}"
      - name: Publish generated MP3 and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Korean Vietnamese neural MP3 and audio manifest"
            git push
          fi
