name: Generate Korean and Vietnamese MP3 (Microsoft Edge TTS)
on:
  # One-time generation is initiated by this workflow file update.
  # Audio commits won't retrigger because only this file matches the push filter.
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-audio.yml"
  workflow_dispatch:
    inputs:
      language:
        description: "Language: both, ko, or vi"
        required: true
        type: choice
        options:
          - both
          - ko
          - vi
        default: both
      offset:
        description: "Start from item number (0 for first)"
        required: false
        default: "0"
      limit:
        description: "How many unique phrases (0 = all remaining)"
        required: false
        default: "0"
permissions:
  contents: write
  actions: write
concurrency:
  group: generate-korean-vietnamese-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voice generator and audio inspector
        run: python -m pip install --upgrade "edge-tts>=7,<8" "mutagen>=1.47,<2"
      - name: Generate remaining Korean/Vietnamese Neural MP3 for all lesson cards
        env:
          VOICE_LANG: ${{ inputs.language || 'both' }}
          VOICE_OFFSET: ${{ inputs.offset || '500' }}
          VOICE_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          python scripts/generate_tts.py --lang "$VOICE_LANG" --offset "$VOICE_OFFSET" --limit "$VOICE_LIMIT" --allow-partial
      - name: Publish generated MP3 and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Korean Vietnamese neural MP3 and audio manifest"
            # Main may advance while speech generation is running.
            # Rebase the finished audio commit rather than discarding generated MP3.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Neural audio published successfully."
                exit 0
              fi
              echo "Branch advanced again; retrying audio push ${attempt}/5."
              sleep 6
            done
            echo "Could not publish generated audio after 5 safe retries." >&2
            exit 1
          fi
      - name: Request GitHub Pages deployment after audio has been pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" \
            -f ref=main
          echo "GitHub Pages deployment dispatched for newly generated audio."
