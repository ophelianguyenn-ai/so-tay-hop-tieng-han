name: Install selected high-detail Nhi cover paintings
on:
  push:
    paths:
      - ".github/workflows/import-nhi-covers-once.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image encoder
        run: python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<14'

      - name: Install six approved realistic-season pictures
        env:
          MEDIA_SUMMER_DAY: "https://sdmntprseasia.oaiusercontent.com/files/00000000-6868-8207-8198-d7779706c4b2/raw?se=2026-11-13T04%3A28%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=4bc70583-8518-5b8e-a0d5-1f9b5751895d&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T00%3A56%3A27Z&ske=2026-11-14T00%3A56%3A27Z&sks=b&skv=2026-06-06&sig=ZAAO0Jn4sLakYdUPAa79hY//XwdGQZMQNM3QTeFDP3g%3D"
          MEDIA_SUMMER_NIGHT: "https://sdmntprseasia.oaiusercontent.com/files/00000000-3244-8207-993c-b812a63572c3/raw?se=2026-11-13T04%3A28%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=4b9c691c-a9aa-58d4-9ca9-f1bdfd07f320&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T02%3A00%3A34Z&ske=2026-11-14T02%3A00%3A34Z&sks=b&skv=2026-06-06&sig=kGwi6VV2g%2B1BU%2BDgWBtJXNl6rRzW%2B6d0d6Zc0u4GwLI%3D"
          MEDIA_AUTUMN_DAY: "https://sdmntprseasia.oaiusercontent.com/files/00000000-d184-8207-b91d-e3d095b24c9b/raw?se=2026-11-13T04%3A28%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=0339cc87-e67d-5698-abe8-c0242e8eac0b&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T00%3A16%3A26Z&ske=2026-11-14T00%3A16%3A26Z&sks=b&skv=2026-06-06&sig=KtjVwpsRREGpFkOnh9yPenvCrmgNAbP%2B%2BuwfGMU3WMw%3D"
          MEDIA_AUTUMN_NIGHT: "https://sdmntprseasia.oaiusercontent.com/files/00000000-ef4c-8207-bc06-eb1dbb16eb7f/raw?se=2026-11-13T04%3A28%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=0e24788a-5f7d-518d-ab4f-f492279bca47&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T00%3A34%3A36Z&ske=2026-11-14T00%3A34%3A36Z&sks=b&skv=2026-06-06&sig=tu3ISP9/TZBE32BZSPu74GxBw497wNreKptBuB2TdQY%3D"
          MEDIA_WINTER_DAY: "https://sdmntprseasia.oaiusercontent.com/files/00000000-e8dc-8207-ad40-069007624977/raw?se=2026-11-13T04%3A28%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=cc8ede88-5f02-51b1-b94e-2d649ac2c5a0&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T02%3A24%3A33Z&ske=2026-11-14T02%3A24%3A33Z&sks=b&skv=2026-06-06&sig=G4JTUAjKPh73zC8JxDJosvWxQA0McNCe5JjNaa/5fvg%3D"
          MEDIA_WINTER_NIGHT: "https://sdmntprseasia.oaiusercontent.com/files/00000000-8a68-8207-ab90-c9bed5cbb686/raw?se=2026-11-13T04%3A28%3A38Z&sp=r&sv=2026-06-06&sr=b&scid=c3a2fdf6-33f0-5c9c-9490-670a4efecc81&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T00%3A56%3A27Z&ske=2026-11-14T00%3A56%3A27Z&sks=b&skv=2026-06-06&sig=fr1jMR6vbi1g8JaYL0aAPidmcvg0Pko7%2BJLY7KxB2w8%3D"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from io import BytesIO
          import os
          import urllib.request
          from PIL import Image

          for season in ("summer", "autumn", "winter"):
              for lighting in ("day", "night"):
                  name=f"{season}-{lighting}"
                  url=os.environ["MEDIA_"+name.upper().replace("-", "_")]
                  req=urllib.request.Request(url,headers={"User-Agent":"NhiLearningCorner-ImageImporter/1.0"})
                  with urllib.request.urlopen(req,timeout=100) as response:
                      raw=response.read(12000000)
                  if not (2500000 <= len(raw) < 12000000):
                      raise RuntimeError(f"Invalid source bytes for {name}: {len(raw)}")
                  with Image.open(BytesIO(raw)) as picture:
                      picture.load()
                      if picture.size!=(1672,941):
                          raise RuntimeError(f"Unexpected source size {name}: {picture.size}")
                      target=f"garden-{name}.webp"
                      picture.convert("RGB").save(target,format="WEBP",quality=94,method=6)
                  with Image.open(target) as check:
                      check.verify()
                  if os.stat(target).st_size < 350000:
                      raise RuntimeError(f"Output looks corrupt: {target}")
                  print(f"Approved: {target} ({os.stat(target).st_size:,} bytes)")
          PY

      - name: Commit installed images to original repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- garden-summer-day.webp garden-summer-night.webp garden-autumn-day.webp garden-autumn-night.webp garden-winter-day.webp garden-winter-night.webp
          if git diff --cached --quiet; then
            echo "All selected images already installed"
            exit 0
          fi
          git commit -m "Install six approved HD illustrated seasonal cover paintings"
          git push origin HEAD:main
          echo "Approved cover paintings committed; GitHub Pages will redeploy them"
