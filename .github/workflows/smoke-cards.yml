name: Verify Korean Flashcard Flip

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'study-update-v6.js'
      - 'study-update-v6.css'
      - 'recorded-voices-v11.js'
      - 'scripts/smoke-study-v6.mjs'
      - 'card-images-v11.js'
      - 'technical-visuals-v12.js'
      - 'hanja-extra-v12.js'
      - 'scripts/smoke-cards.mjs'
      - 'scripts/smoke-ux-v3.mjs'
      - 'nhi-hard-minimal-v1.js'
      - 'nhi-study-motion-v3.css'
      - 'nhi-fireworks-v3.js'
      - 'nhi-interface-v4.css'
      - 'nhi-interface-v4.js'
      - 'scripts/smoke-ux-v4.mjs'
      - 'scripts/smoke-ux-v5.mjs'
      - 'scripts/smoke-english-v7.mjs'
      - 'nhi-interface-v5.js'
      - 'nhi-interface-v5.css'
      - 'nhi-phrases-v5.js'
      - 'nhi-english-v5.js'
      - '.github/workflows/smoke-cards.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chrome automation
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Start local static site
        run: |
          if [ ! -f english.json ]; then printf '{"version":1,"cards":{}}\n' > english.json; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nhi-site-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nhi-site-server.log
          exit 1
      - name: Confirm Vietnamese to Korean flip is visible
        run: node scripts/smoke-cards.mjs
      - name: Check mobile layout, rating animations and fireworks
        if: ${{ !cancelled() }}
        run: node scripts/smoke-ux-v3.mjs
      - name: Check independent window closing, cover theme, English and phrase segments
        if: ${{ !cancelled() }}
        run: node scripts/smoke-ux-v5.mjs
      - name: Verify English original survives compare, synonyms and neural download
        if: ${{ !cancelled() }}
        run: node scripts/smoke-english-v7.mjs

      - name: Verify face speech, hotkeys, notes, dictionary, clipboard images and English review
        if: ${{ !cancelled() }}
        run: node scripts/smoke-study-v6.mjs
